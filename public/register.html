<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ChatApp - Register</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f3f4f6;
    }

    .register-container {
        width: 400px;
        max-width: 90%;
        background: white;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
        width: 60px;
        height: 60px;
        margin: 0 auto 15px;
        border-radius: 16px;
        background: #4f46e5;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
    }

    .brand {
        text-align: center;
        margin-bottom: 30px;
    }

    .brand h1 {
        color: #1f2937;
        font-size: 26px;
        margin-bottom: 7px;
    }

    .brand p {
        color: #8b8f98;
        font-size: 13px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #374151;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #dfe3e8;
        border-radius: 10px;
        outline: none;
        font-size: 14px;
        transition: 0.2s;
    }

    input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .register-btn {
        width: 100%;
        padding: 13px;
        margin-top: 5px;
        border: none;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .register-btn:hover {
        background: #4338ca;
    }

    #message {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        min-height: 20px;
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #6b7280;
    }

    .login-link a {
        color: #4f46e5;
        text-decoration: none;
        font-weight: bold;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 500px) {

        .register-container {
            padding: 30px 22px;
        }

    }

</style>


</head>

<body>


<div class="register-container">

    <div class="logo">
        💬
    </div>

    <div class="brand">

        <h1>Register Account</h1>

        <!-- <p>
            Join ChatApp and start messaging
        </p> -->

    </div>


    <div class="form-group">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Choose a username"
            autocomplete="username"
        >

    </div>


    <div class="form-group">

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
        >

    </div>


    <button
        class="register-btn"
        onclick="registerUser()"
    >
        Register
    </button>


    <p id="message"></p>


    <div class="login-link">

        Already have an account?

        <a href="/login.html">
            Login
        </a>

    </div>

</div>


<script>

    async function registerUser() {

        const username =
            document.getElementById("username")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;


        if (!username || !password) {

            document.getElementById("message")
                .textContent =
                "Please enter username and password";

            return;

        }


        try {

            const response =
                await fetch("/api/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        username: username,
                        password: password

                    })

                });


            const data =
                await response.json();


            document.getElementById("message")
                .textContent =
                data.message;


            if (response.ok) {

                setTimeout(() => {

                    window.location.href =
                        "/login.html";

                }, 1000);

            }


        } catch (error) {

            document.getElementById("message")
                .textContent =
                "Unable to connect to server";

            console.error(error);

        }

    }

</script>


</body>

</html>
